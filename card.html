<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1080px;height:1080px;background:#0b0c0e;font-family:"Inter","Helvetica Neue",Arial,sans-serif;color:#f4f4f0}
.wrap{position:relative;width:1080px;height:1080px;box-sizing:border-box;padding:96px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.glow{position:absolute;right:-220px;top:-220px;width:760px;height:760px;border-radius:50%;background:radial-gradient(circle,rgba(214,255,61,.22),rgba(214,255,61,0) 62%)}
.kicker{font-size:25px;letter-spacing:.12em;text-transform:uppercase;color:#a8aaa2}
.kicker b{color:#d6ff3d;font-weight:600}
.name{font-size:200px;font-weight:700;letter-spacing:-.045em;line-height:.9;margin:0}
.tag{font-size:46px;line-height:1.25;color:#d9dad3;max-width:820px;margin-top:40px}
.foot{display:flex;justify-content:space-between;font-size:26px;color:#8b8d86;border-top:1px solid #2a2c2f;padding-top:28px}
.foot span:first-child{color:#d6ff3d}
</style></head><body><div class="wrap"><div class="glow"></div>
<div class="kicker">Proposed name for <b>Risk Pricing</b> · risk.seer.pm</div>
<div><h1 class="name" id="n">Name</h1><div class="tag" id="t">Tagline</div></div>
<div class="foot"><span id="d">name.seer.pm</span><span>Seer · market-priced DeFi risk</span></div>
</div><script>
const p=new URLSearchParams(location.search);document.getElementById('n').textContent=p.get('n');document.getElementById('t').textContent=p.get('t');document.getElementById('d').textContent=(p.get('n')||'').toLowerCase()+'.seer.pm';
</script></body></html>
